# Publication sur GitHub Pages : assemble le jeu (outils/assembler.js) puis publie le dossier _site/.
# À activer une fois : dépôt GitHub › Settings › Pages › Build and deployment › Source : « GitHub Actions ».
# Tant que la source reste « Deploy from a branch », le site continue d'être servi tel quel depuis main.
name: Publier le jeu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assembler le jeu
        run: node outils/assembler.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
