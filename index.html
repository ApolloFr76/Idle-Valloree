<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Les Terres de Vallorée</title>

<link rel="stylesheet" href="style/style.css">

<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">Vallorée</div>
    <button class="btn" id="helpBtn" data-a="help" title="Aide" style="order:8">?</button>
    <button class="btn" id="pauseBtn" data-a="pause" title="Pause (touche P)" style="order:9">Pause</button>
    <div class="hero" id="heroBox"></div>
    <div class="xpbox" data-tip="hd:xp">
      <div class="lbl"><span id="lvlTxt">Niveau 1</span><span class="num" id="xpTxt">0 / 0 XP</span></div>
      <div class="bar xp"><i id="xpBar"></i></div>
    </div>
    <div class="ecus num" data-tip="hd:ecus"><span class="coin"></span><span id="ecusTxt">0</span></div>
  </header>

  <div class="main">
    <section class="card" id="combat">
      <div class="zones" id="zones"></div>
      <div class="modebar" id="modeBar"></div>
      <div class="arena" id="arena">
        <div class="mhead"><h3 id="mName">…</h3><span class="mlvl num" id="mLvl"></span></div>
        <div class="mel" id="mEl"></div>
        <div class="mon" id="mon"><img class="px ahero" id="ahero" alt="" hidden><button id="monBtn" data-tip="cur:mon" aria-label="Frapper le monstre"></button></div>
        <div class="bars">
          <div><div class="blbl"><span>Monstre</span><span class="num" id="mHpTxt"></span></div><div class="bar mhp"><i id="mHpBar"></i></div></div>
          <div><div class="blbl"><span>Vous</span><span class="num" id="pHpTxt"></span></div><div class="bar hp"><i id="pHpBar"></i></div></div>
        </div>
        <div class="buffs" id="buffs"></div>
        <div class="weather" id="weather"></div>
        <div class="combo" id="combo" hidden><b class="num" id="comboN"></b><div class="bar"><i id="comboBar"></i></div></div>
        <div class="kostate" id="pauseOv" hidden>En pause</div>
        <div class="kostate" id="ko" hidden>K.O. · retour dans <span class="num" id="koT"></span> s</div>
      </div>
      <div class="hint" id="hint">Cliquez sur le monstre pour frapper. Le combat continue tout seul.</div>
      <div class="spells" id="spells"></div>
      <div class="row" id="pots" style="margin-top:8px;gap:6px"></div>
      <div class="goals" id="goals"></div>
      <div class="log" id="log"></div>
    </section>

    <section class="card" id="panelCard">
      <nav class="tabs" id="tabs"></nav>
      <div id="panel"></div>
    </section>
    <section class="card" id="sideCard" hidden></section>
  </div>
</div>
<div class="ov" id="ov" hidden></div>
<canvas id="amb" aria-hidden="true"></canvas>
<div class="toast" id="toast" hidden></div>
<div id="tuto" hidden><div class="tspot" id="tspot"></div><div class="tbub" id="tbub" role="dialog" aria-live="polite"></div></div>
<div class="tipcard" id="tipcard" hidden role="status"></div>

const SETB_C={},SETB=key=>SETB_C[key]||(SETB_C[key]=SETB0(key)),SETB0=key=>{const t=SETS[key],b=SET_BONUS(t.z+(t.boss?.5:0)),mp=t.boss?SET_MAP_BOSS:SET_MAP[t.n],o={};for(const k in mp){o[k]={};for(const x in b[mp[k]])o[k][x]=Math.round(b[mp[k]][x])}return o};
const setSteps=key=>SETS[key].steps||(SETS[key].steps=Object.keys(SETB(key)).map(Number));
function setBox(z,n,compact){const T=SETS[z],b=SETB(z),N=T.n,ST=setSteps(z),c=Math.min(N,n||0),nx=ST.find(k=>k>c);
  return`<div class="setb"><b>Panoplie ${T.name}</b> · <span class="num">${c}/${N}</span> pièce${c>1?"s":""} portée${c>1?"s":""}<div class="setpips">${Array.from({length:N},(_,i)=>i+1).map(i=>`<i class="${i<=c?"on":""}${ST.includes(i)?" t":""}"></i>`).join("")}</div>
  <div>Total actif : <b style="color:var(--xp)">${statsTxt(setTotal(z,c))||"aucun"}</b></div>${nx?`<div class="small">Prochain palier (${nx} pièces) : <b>${statsTxt(b[nx])}</b></div>`:`<div class="small"><b style="color:var(--gold)">Panoplie complète !</b></div>`}
  ${compact?"":`<div class="small" style="margin-top:4px">${ST.map(k=>`<span class="${c>=k?"":"off"}">${c>=k?"✓":"·"} ${k} pièces : ${statsTxt(b[k])}</span>`).join("<br>")}</div>`}</div>`}
const setTotal=(z,n)=>{const b=SETB(z),o={};setSteps(z).filter(k=>k<=n).forEach(k=>{for(const x in b[k])o[x]=(o[x]||0)+b[k][x]});return o};

function giveTrophy(id){const own=S.items.filter(x=>x.id===id);if(!own.length){S.items.push({u:S.uid++,id,e:0});return 0}
  const eq=new Set(Object.values(S.equip)),t=own.find(x=>eq.has(x.u))||own[0];t.e=(t.e||0)+1;mx("trophyRank",t.e);dirty=true;log(`${ITEMS[id].name} fusionné : rang ${t.e+1}.`,"g");return t.e}
function fuseTrophies(){const by={};S.items.forEach(x=>{if(ITEMS[x.id]?.slot==="trophee")(by[x.id]=by[x.id]||[]).push(x)});const eq=new Set(Object.values(S.equip)),drop=new Set();
  for(const id in by){const L=by[id];if(L.length<2)continue;const k=L.find(x=>eq.has(x.u))||L[0];L.forEach(x=>{if(x!==k){k.e=(k.e||0)+1+(x.e||0);drop.add(x)}})}
  if(drop.size){S.items=S.items.filter(x=>!drop.has(x));for(const k in S.equip)if([...drop].some(x=>x.u===S.equip[k]))S.equip[k]=null}}

/* ================= Moteur pixel art (sprites et décors générés par le code) ================= */
const PX=(()=>{
  const cache={};
  const rgb=c=>{if(Array.isArray(c))return c;if(c[0]==="#"){if(c.length===4)c="#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];const n=parseInt(c.slice(1),16);return[n>>16,n>>8&255,n&255]}return c.match(/\d+/g).slice(0,3).map(Number)};
  const mix=(a,b,p)=>{a=rgb(a);b=rgb(b);return[0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*p))};
  const LIGHT="#fff2c2",DARK="#2b1842",INK="#1c1020";
  function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
  class Spr{
    constructor(w,h){this.w=w;this.h=h;this.p=new Array(w*h).fill(null);this.sh=[]}
    set(x,y,c){x|=0;y|=0;if(x>=0&&y>=0&&x<this.w&&y<this.h)this.p[y*this.w+x]=rgb(c)}
    get(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h?this.p[y*this.w+x]:null}
    /* part(couleur, m=>{…formes…}, {flat}) : dessine un masque puis l'ombre en 3 tons */
    part(col,fn,o={}){
      const w=this.w,h=this.h,M=new Uint8Array(w*h);
      const put=(x,y,v=1)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<w&&y<h)M[y*w+x]=v};
      const m={px:put,
        rect:(x,y,rw,rh)=>{for(let j=0;j<rh;j++)for(let i=0;i<rw;i++)put(x+i,y+j)},
        ell:(cx,cy,rx,ry)=>{for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const dx=(x-cx)/(rx+.35),dy=(y-cy)/(ry+.35);if(dx*dx+dy*dy<=1)put(x,y)}},
        poly:pts=>{let y0=1e9,y1=-1e9;pts.forEach(q=>{y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])});
          for(let y=Math.floor(y0);y<=y1;y++){const xs=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=y&&b[1]>y)||(b[1]<=y&&a[1]>y))xs.push(a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]))}
            xs.sort((a,b)=>a-b);for(let i=0;i+1<xs.length;i+=2)for(let x=Math.round(xs[i]);x<=Math.round(xs[i+1]);x++)put(x,y)}
          pts.forEach(q=>put(q[0],q[1]))},
        line:(x0,y0,x1,y1,t=1)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;for(let a=0;a<t;a++)for(let b=0;b<t;b++)put(x+a,y+b)}},
        clear:(x,y,rw,rh)=>{for(let j=0;j<rh;j++)for(let i=0;i<rw;i++)put(x+i,y+j,0)}};
      fn(m);
      let x0=w,x1=-1,y0=h,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(M[y*w+x]){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
      if(x1<0)return this;
      const base=rgb(col),lt=mix(base,LIGHT,o.lt??.38),dk=mix(base,DARK,o.dk??.36),bw=x1-x0+1,bh=y1-y0+1,cx=(x0+x1)/2,cy=(y0+y1)/2;

  }

      if(m.ft==="flame"){s.part("#ff7a2c",q=>q.poly([[15,top+4],[16,top-3],[19,top],[21,top-8],[24,top-1],[25,top+4]]));s.part("#ffd84a",q=>q.poly([[18,top+4],[20,top-2],[22,top+4]]),{flat:1})}

    };
    if(m.shape==="blob"){eyeY=25;top=16;back();s.part(c,q=>{q.ell(20,27,13,9);q.rect(8,30,25,6);q.clear(8,36,2,1);q.clear(31,36,2,1)})}
    else if(m.shape==="tall"){eyeY=19;top=7;back();s.part(c,q=>{q.ell(20,15,9,8);q.rect(11,15,19,21);q.clear(11,36,1,1);q.clear(29,36,1,1)});s.part(mix(c,DARK,.3),q=>{q.rect(13,36,5,1);q.rect(23,36,5,1)},{flat:1})}
    else if(m.shape==="spiky"){eyeY=25;top=13;back();s.part(c,q=>{for(let i=0;i<10;i++){const a=Math.PI*2*i/10-Math.PI/2;q.poly([[20+Math.cos(a-.3)*8,26+Math.sin(a-.3)*8],[20+Math.cos(a)*16,26+Math.sin(a)*13.5],[20+Math.cos(a+.3)*8,26+Math.sin(a+.3)*8]])}q.ell(20,26,10,9)})}

    else{s.part(col,q=>q.poly([[3,6],[6,2],[10,2],[13,6],[8,14]]),{lt:.6});s.part(lt,q=>{q.rect(6,3,4,1);q.line(4,6,12,6)},{flat:1})}

  function scene(id){
    const k="s:"+id;if(cache[k])return cache[k];const T=TH[id]||TH.prairie,W=240,H=130,s=new Spr(W,H),r=rng(id.length*7919+id.charCodeAt(0)*131+id.charCodeAt(1));
    const G=T.g.map(rgb),P=rgb(T.path),WY=24;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)s.p[y*W+x]=G[0];
    /* plaques de teinte */
    for(let i=0;i<34;i++){const cx=r()*W,cy=WY+r()*(H-WY),rx=6+r()*16,ry=3+r()*7,c=G[1+(i%3)];
      for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const d=((x-cx)/rx)**2+((y-cy)/ry)**2;if(d<1&&(d<.7||(x+y)%2===0))s.set(x,y,c)}}
    /* clairière au centre, là où l'on se bat */
    for(let y=30;y<92;y++)for(let x=60;x<180;x++){const d=((x-120)/56)**2+((y-62)/24)**2;if(d<.72||(d<1&&(x+y)%2===0))s.set(x,y,P)}
    {const pl=mix(P,LIGHT,.35),pd=mix(P,DARK,.22);for(let i=0;i<90;i++){const x=70+(r()*100|0),y=42+(r()*40|0);if(((x-120)/50)**2+((y-62)/20)**2<1){const c=r()<.5?pl:pd;s.set(x,y,c);s.set(x+1,y,c)}}}
    /* eau */
    if(T.water){const wc=rgb(T.water),wl=mix(wc,"#ffffff",.45),wd=mix(wc,DARK,.3),sh=mix(G[3],DARK,.35);
      [[30,96,30,13],[214,44,22,9]].forEach(([cx,cy,rx,ry])=>{for(let y=Math.floor(cy-ry-2);y<=cy+ry+2;y++)for(let x=Math.floor(cx-rx-2);x<=cx+rx+2;x++){const d=((x-cx)/rx)**2+((y-cy)/ry)**2;
        if(d<1){let c=wc;if(y<cy-ry*.45&&d>.5)c=wd;else if((x+y*3)%13===0||((x*5+y*2)%17===0&&x%2))c=wl;s.set(x,y,c)}else if(d<1.25)s.set(x,y,sh)}})}
    /* brins, fleurs, cailloux */
    for(let i=0;i<420;i++){const x=r()*W|0,y=WY+2+(r()*(H-WY-3)|0),c=r()<.5?G[2]:G[1];if(s.get(x,y)===G[0]||s.get(x,y)===G[1]||s.get(x,y)===G[2]){s.set(x,y,c);s.set(x+1,y,c);if(r()<.4)s.set(x,y-1,c)}}
    for(let i=0;i<70;i++){const x=4+(r()*(W-8)|0),y=WY+4+(r()*(H-WY-8)|0),c=T.fl[r()*T.fl.length|0];if(T.water&&s.get(x,y)&&s.get(x,y)[2]>s.get(x,y)[1]&&!T.nw)continue;s.set(x,y,c);if(r()<.5){s.set(x+1,y,c);s.set(x,y+1,mix(c,DARK,.3))}}
    /* fond : mur, lisière, falaise… */
    const wc=rgb(T.wc);
    if(T.wall==="stone"||T.wall==="rock"||T.wall==="cliff"||T.wall==="ice"){
      const lt=mix(wc,LIGHT,.35),dk=mix(wc,DARK,.4),ink=mix(wc,INK,.7),bh=T.wall==="stone"?6:8;
      for(let y=0;y<WY;y++)for(let x=0;x<W;x++)s.set(x,y,dk);
      for(let row=0;row*bh<WY;row++){let x=-(row%2)*5-(r()*4|0);while(x<W){const bw=T.wall==="stone"?9+(r()*5|0):12+(r()*12|0),y0=row*bh,c=r()<.3?mix(wc,DARK,.15):r()<.3?mix(wc,LIGHT,.12):wc;
        for(let j=0;j<bh-1;j++)for(let i=0;i<bw-1;i++){const e=(i===0&&j===0)||(i===bw-2&&j===0)||(i===0&&j===bh-2)||(i===bw-2&&j===bh-2);if(e)continue;s.set(x+i,y0+j,j===0||i===0?lt:(j===bh-2||i===bw-2?mix(c,DARK,.25):c))}x+=bw}}
      for(let x=0;x<W;x++){s.set(x,WY,ink);s.set(x,WY+1,mix(G[3],DARK,.35));if((x*7)%3)s.set(x,WY+2,mix(G[3],DARK,.2))}
      if(T.wall==="stone")for(let i=0;i<26;i++){const x=r()*W|0,y=r()*8|0;s.set(x,y,G[2]);s.set(x+1,y,G[1]);s.set(x,y+1,G[2])}
      if(T.wall==="ice")for(let x=0;x<W;x++){const hgt=1+((x*13)%5===0?3:(x*7)%3);for(let j=0;j<hgt;j++)s.set(x,j,"#f8fdff")}
      if(T.wall==="rock")for(let x=20;x<W;x+=66){for(let y=0;y<WY;y++){s.set(x,y,"#7a5232");s.set(x+1,y,"#9a6a3c");s.set(x+2,y,"#5a3a22")}for(let i=-6;i<9;i++){s.set(x+i,2,"#9a6a3c");s.set(x+i,3,"#5a3a22")}}
    }else{
      const dk=mix(wc,DARK,.45);for(let y=0;y<WY;y++)for(let x=0;x<W;x++)s.set(x,y,(x+y)%2&&y>WY-4?mix(G[3],DARK,.25):dk);
      if(T.wall==="trees"){for(let x=6;x<W;x+=14+(r()*8|0)){const tw=4+(r()*3|0);for(let y=6;y<WY+2;y++)for(let i=0;i<tw;i++)s.set(x+i,y,i===0?"#7a5a40":i===tw-1?"#2e2018":"#5a4030")}
        for(let i=0;i<60;i++){const cx=r()*W,cy=r()*9,rr=4+r()*5,c=r()<.5?mix(wc,LIGHT,.18):mix(wc,DARK,.1);for(let y=Math.floor(cy-rr);y<=cy+rr;y++)for(let x=Math.floor(cx-rr);x<=cx+rr;x++)if((x-cx)**2+(y-cy)**2<rr*rr)s.set(x,y,c)}}
      if(T.wall==="reeds"){const w2=rgb(T.water),wl=mix(w2,"#fff",.4);for(let y=0;y<WY-3;y++)for(let x=0;x<W;x++)s.set(x,y,(x+y*5)%19===0?wl:w2);
        for(let x=1;x<W;x+=3+(r()*4|0)){const hgt=6+(r()*9|0);for(let j=0;j<hgt;j++)s.set(x,WY+1-j,j>hgt-3?"#7a4a2a":r()<.5?"#7fa24e":"#5c8040")}}
    }
    /* accessoires, triés par profondeur, en dehors de la clairière */
    const items=[];T.props.forEach(([n,cnt,...a])=>{for(let i=0;i<cnt;i++){const sp=prop[n](r,...a);let x,y,t=0;do{x=r()*(W-sp.w)|0;y=(n==="tree"||n==="pine"?WY-22:WY+2)+(r()*(H-WY-sp.h+ (n==="tree"||n==="pine"?16:0))|0);t++}while(t<30&&((x+sp.w>62&&x<178&&y+sp.h>34&&y+sp.h<100)||(T.water&&s.get(x+sp.w/2|0,y+sp.h-1)&&s.get(x+sp.w/2|0,y+sp.h-1)[2]>170&&!T.nw)));
      items.push([sp,x,y])}});
    items.sort((a,b)=>a[2]+a[0].h-b[2]-b[0].h).forEach(([sp,x,y])=>{const sc=mix(G[3],DARK,.4);for(let i=1;i<sp.w-1;i++){s.set(x+i,y+sp.h-1,sc);if(i>1&&i<sp.w-2)s.set(x+i,y+sp.h,sc)}s.blit(sp,x,y)});
    return cache[k]=s.url()}

  /* ---------- Motif de fond de page ---------- */
  /* Fond de page : herbe (ou sol) du biome, un peu plus sombre que l'arène */
  function tile(id="prairie"){const k="t:"+id;if(cache[k])return cache[k];const T=TH[id]||TH.prairie,s=new Spr(32,32),r=rng(4242+id.length*31),g=T.g.map(c=>mix(c,DARK,.18));for(let i=0;i<1024;i++)s.p[i]=g[0];
    for(let i=0;i<70;i++){const x=r()*32|0,y=r()*32|0,c=g[1+(r()*3|0)];s.set(x,y,c);s.set((x+1)%32,y,c);if(r()<.4)s.set(x,(y+31)%32,c)}
    const fl=T.fl||["#ffd84a","#fff"];[[5,7],[21,19],[14,27],[27,4]].forEach(([x,y],i)=>{const c=fl[i%fl.length];s.set(x,y,c);s.set(x+1,y,mix(c,DARK,.25))});return cache[k]=s.url()}

  const img=(u,cls="",w,h)=>`<img class="px ${cls}" src="${u}" alt="" draggable="false"${w?` width="${w}" height="${h}"`:""}>`;
  return{monster,hero,pickup,scene,tile,img,item,res,drop,key,potion,pet,ground:id=>(TH[id]||TH.prairie).g[0]};
})();

document.body.style.backgroundImage=`url(${PX.tile()})`;
let biomeId=null;
function setBiome(id){if(id===biomeId)return;biomeId=id;const b=document.body,c=mix2(PX.ground(id));b.style.backgroundImage=`url(${PX.tile(id)})`;b.style.backgroundColor=c;document.documentElement.style.backgroundColor=c;ambReset()}

function cast(sp,auto){
  if(S.ko>0||!S.mon||S.lvl<sp.lvl||(S.cds[sp.id]||0)>S.time)return;
  const st=stats(),C=CLASSES[S.cls];S.cds[sp.id]=S.time+spCd(sp,st);
  sp.fx.forEach(f=>{
    if(f.t==="hit")hitMon(roll(f.m*C.spellMult,st),"spell");
    if(f.t==="dot")S.dots.push({m:f.m*C.spellMult,until:S.time+f.d,acc:0});
    if(f.t==="heal"){const h=Math.round(st.maxHp*f.p);S.hp=Math.min(st.maxHp,S.hp+h);if(fx){floatNum("+"+fmt(h),"heal");FX.heal()}}
    if(f.t==="buff")pkBuff(f.k,f.v,f.d,sp.name);
  });
  if(!auto&&fx)log(`Vous lancez ${sp.name}.`,"w");
}
function gainGather(pid,rid,quiet){

}

function spawnPk(){let r=Math.random()*PICKUPS.reduce((a,p)=>a+p.w,0),p=PICKUPS[0];for(const q of PICKUPS){if((r-=q.w)<0){p=q;break}}

function makeQuest(){

  if(t==="boss"){q.need=rnd(1,2);q.txt=`Vaincre ${q.need} boss de zone`}

function ensureQuests(){const d=today();if(!S.q||S.q.day!==d){S.q={day:d,list:[0,1,2].map(makeQuest),reroll:1,bonus:false};dirty=true}}
function qProg(type,key,n=1){if(!S.q)return;S.q.list.forEach(q=>{if(q.done||q.type!==type)return;if(q.key!=null&&q.key!==key)return;q.have=Math.min(q.need,q.have+n);if(q.have>=q.need){q.done=true;if(S.opt.logQuests)log(`Quête terminée : ${q.txt}. Récupérez la récompense dans l'onglet Quêtes.`,"g");if(fx)toast("Quête terminée !")}dirty=true})}
function marketTick(){S.mkPrev={...S.mk};Object.values(RES).forEach(r=>{if(r.kind==="k")return;const m=S.mk[r.id]||1;S.mk[r.id]=+Math.min(MK_MAX,Math.max(MK_MIN,m+(Math.random()-.5)*.25+(1-m)*.08)).toFixed(3)})}

let AC=null,master=null,musicGain=null,sfxGain=null,lastHitSfx=0,musicTimer=null,mStep=0;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);musicGain=AC.createGain();musicGain.connect(master);sfxGain=AC.createGain();sfxGain.connect(master);setVol()}catch(e){AC=null}}
function setVol(){if(!AC)return;const O=S.opt||OPT_DEF;master.gain.value=O.vol*.6;sfxGain.gain.value=O.volSfx;musicGain.gain.value=O.music?.7*O.volMusic:0}
function tone(f,t0,d,type="sine",g=.2,dest){const o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);a.gain.setValueAtTime(0,t0);a.gain.linearRampToValueAtTime(g,t0+.01);a.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(a);a.connect(dest||sfxGain||master);o.start(t0);o.stop(t0+d+.05)}
function sfx(k){if(!AC||!S.opt?.sfx||document.hidden)return;const t=AC.currentTime;
  if(k==="hit"){if(!S.opt.hitSfx||t-lastHitSfx<.07)return;lastHitSfx=t;tone(180+Math.random()*40,t,.08,"square",.05);tone(90,t,.06,"triangle",.08)}
  if(k==="crit"){tone(520,t,.12,"square",.06);tone(780,t+.05,.15,"triangle",.08)}
  if(k==="kill"){[392,523,659].forEach((f,i)=>tone(f,t+i*.06,.16,"triangle",.09))}
  if(k==="coin"){tone(988,t,.08,"square",.04);tone(1319,t+.07,.18,"square",.04)}
  if(k==="pickup"){[784,988,1175,1568].forEach((f,i)=>tone(f,t+i*.05,.2,"sine",.08))}
  if(k==="level"){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.1,.3,"triangle",.1))}
  if(k==="boss"){[262,330,392,523,659].forEach((f,i)=>tone(f,t+i*.08,.35,"sawtooth",.04))}
  if(k==="fail"){[392,330,262].forEach((f,i)=>tone(f,t+i*.12,.25,"triangle",.08))}
  if(k==="anvil"){tone(1400,t,.12,"square",.05);tone(700,t,.2,"triangle",.1)}
  if(k==="anvilBad"){tone(160,t,.2,"sawtooth",.05)}
  if(k==="event"){tone(440,t,.5,"sine",.07);tone(660,t+.15,.6,"sine",.06)}
}
const SCALE=[0,2,4,7,9],ROOTS=[220,196,174.6,196];
function musicTick(){if(!AC||!S.opt?.music||document.hidden)return;const t=AC.currentTime+.05,bar=Math.floor(mStep/8)%4,root=ROOTS[bar]*Math.pow(2,(ZKEY[S.zone]||0)/12);
  if(mStep%8===0){tone(root/2,t,2.2,"sine",.12,musicGain);tone(root*1.5/2,t,2.2,"sine",.06,musicGain)}
  if(Math.random()<.7){const n=SCALE[rnd(0,4)]+(Math.random()<.3?12:0);tone(root*Math.pow(2,n/12),t,.6,"triangle",.05,musicGain)}
  mStep++}

  o.innerHTML=`<div class="ovc"><div><h2>Les Terres de Vallorée</h2><p class="muted">Choisissez votre classe. Votre élément (Feu, Eau, Terre, Air) dépendra des points que vous y investirez.</p></div>
  <div class="classes">${Object.entries(CLASSES).map(([k,c])=>`<button class="cls${k===pick?" on":""}" data-a="pick" data-k="${k}">${heroSVG(k)}<h3>${c.name}</h3><span class="small muted">${c.desc}</span><ul>${c.spells.map(s=>`<li>${s.name} (niv. ${s.lvl}) : ${s.txt}</li>`).join("")}</ul></button>`).join("")}</div>
  <div class="row"><input type="text" id="heroName" maxlength="20" value="${esc(S.name||"Aventurier")}" aria-label="Nom du personnage"><button class="btn pri" data-a="start" style="padding:9px 16px;font-size:14px">Commencer l'aventure</button></div></div>`;
}
function showOffline(s){
  const h=Math.floor(s.sec/3600),m=Math.floor(s.sec%3600/60),res=Object.entries(s.res);
  const o=$("ov");o.hidden=false;
  o.innerHTML=`<div class="ovc" style="max-width:460px"><h2>Pendant votre absence</h2><p class="muted">${h?h+" h ":""}${m} min écoulées${s.sec>=8*3600?" (maximum 8 h)":""}.</p>
  ${s.kills?`<p><b class="num">${fmt(s.kills)}</b> monstres vaincus · <span style="color:var(--xp)">+${fmt(s.xp)} XP</span> · <span style="color:var(--gold)">+${fmt(s.ecus)} écus</span></p>`:s.danger?`<p class="small muted">La zone choisie était trop dangereuse pour chasser seul.</p>`:""}
  ${res.length?`<p class="small">${res.map(([n,q])=>`${fmt(q)}× ${n}`).join(" · ")}</p>`:""}
  <div class="row"><button class="btn pri" data-a="closeOv">Continuer</button></div></div>`;
}

/* ================= Événements ================= */
document.addEventListener("pointerdown",e=>{if(forge&&!forge.done&&e.button===0&&e.target.closest('[data-a="forgeHit"]')){e.preventDefault();forgeStrike()}},true);
document.addEventListener("click",e=>{ptrDown=false;
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="auto")return;
  switch(a){
    case"pick":pick=b.dataset.k;S.name=$("heroName").value;showCreate();break;
    case"start":{S.cls=pick;S.name=($("heroName").value||"Aventurier").trim().slice(0,20)||"Aventurier";S.hp=stats().maxHp;$("ov").hidden=true;log(`Bienvenue, ${esc(S.name)}. La Prairie des Clochettes vous attend.`,"g");boot2();save();if(!S.tutoDone)setTimeout(tutoStart,400);break}
    case"closeOv":$("ov").hidden=true;break;
    case"pickup":takePk();break;
    case"mode":startMode(b.dataset.m,b.dataset.z!=null?+b.dataset.z:null);renderPanel();break;
    case"quit":endMode(false,"abandon");break;
    case"prestAsk":if(!S.opt.confirmPrest){doPrestige();break}prestConfirm=true;renderPanel();break;
    case"prestNo":prestConfirm=false;renderPanel();break;
    case"prestYes":prestConfirm=false;doPrestige();break;
    case"talent":{const id=b.dataset.t,T=TAL[id];if(T.prev&&!tal(T.prev))break;const c=talCost(id);if(S.souls<c)break;S.souls-=c;S.tal[id]=tal(id)+1;S.hp=Math.min(S.hp,stats().maxHp);renderPanel();break}
    case"talReset":{let r=0;for(const id in S.tal)if(TAL[id])r+=talSpent(id);S.souls+=r;S.tal={};toast(`${r} éclats rendus`);renderPanel();break}
    case"ctab":ctab=b.dataset.t;renderPanel();break;
    case"clsSwap":{const k=b.dataset.k,c=clsCost();if(!CLASSES[k]||k===S.cls||S.souls<c)break;S.souls-=c;S.clsSwaps=(S.clsSwaps||0)+1;S.cls=k;S.cds={};S.buffs=[];S.hp=Math.min(S.hp,stats().maxHp);drawHero();drawSpells();mbSig="";log(`Vous devenez ${CLASSES[k].name}.`,"g");toast(`Nouvelle classe : ${CLASSES[k].name}`);renderPanel(true);break}
    case"goalsToggle":S.opt.goalsOpen=!S.opt.goalsOpen;goalSig="";drawGoals();break;
    case"tutoNext":tutoI++;tutoDraw();break;
    case"tutoPrev":tutoI=Math.max(0,tutoI-1);tutoDraw();break;
    case"tutoSkip":tutoEnd();break;
    case"tutoReplay":tutoStart();break;
    case"unlReplay":if(tabOpen(b.dataset.t))tutoRun(unlTour(b.dataset.t),"unl");break;
    case"help":S.tab="opts";otab="aide";renderPanel();break;
    case"tipOk":closeTip();break;
    case"tipGo":{const t=tipShown;if(t&&t.tab){S.tab=t.tab;renderPanel()}closeTip();break}
    case"tipsReset":S.tips={};tipQ=[];toast("Les conseils réapparaîtront au fil du jeu",1);break;
    case"otab":otab=b.dataset.t;renderPanel();break;
    case"optSet":{const k=b.dataset.k,v=b.dataset.v;S.opt[k]=isNaN(+v)?v:+v;applyOpts();renderPanel();break}
    case"optDefault":S.opt=Object.assign({},OPT_DEF);applyOpts();toast("Réglages par défaut rétablis",1);renderPanel();break;
    case"saveNow":save();lastSave=Date.now();toast("Partie enregistrée",1);break;
    case"pause":setPause(!paused);break;
    case"forgeHit":break; /* géré au pointerdown, plus précis */
    case"forgeSkip":forgeFinish(true);break;
    case"forgeClose":$("ov").hidden=true;forge=null;renderPanel();break;
    case"drink":drink(b.dataset.r,false);renderPanel();break;
    case"brew":brew(b.dataset.r,b.dataset.n==="max"?999:+b.dataset.n);renderPanel();break;
    case"qClaim":{const q=S.q.list[+b.dataset.i];if(!q||!q.done||q.claimed)break;q.claimed=true;gainEcus(q.ecus);if(q.xp)gainXp(q.xp);inc("quests");log(`Récompense de quête : <span class="g">+${fmt(q.ecus)} écus</span>${q.xp?`, <span class="x">+${fmt(q.xp)} XP</span>`:""}`,"g");
      if(S.q.list.every(x=>x.claimed)&&!S.q.bonus){S.q.bonus=true;S.souls++;S.soulsTotal=(S.soulsTotal||0)+1;log("Toutes les quêtes du jour sont terminées : +1 éclat d'âme !","g");toast("+1 éclat d'âme")}renderPanel();break}
    case"qReroll":{if(!S.q||S.q.reroll<1)break;const i=+b.dataset.i;if(S.q.list[i].done)break;S.q.list[i]=makeQuest();S.q.reroll--;renderPanel();break}
    case"mkSell":{const k=b.dataset.r,g=sellRes(k,b.dataset.n==="all"?S.res[k]:+b.dataset.n);if(g)toast(`+${fmt(g)} écus`);renderPanel();break}
    case"ally":{const i=+b.dataset.i,id=ALLIES[i][0];let n=b.dataset.n==="max"?1e9:+b.dataset.n,bought=0;while(n-->0){const c=allyCost(i,S.allies[id]||0);if(S.ecus<c)break;S.ecus-=c;S.allies[id]=(S.allies[id]||0)+1;bought++}
      if(bought){const l=S.allies[id];if(Math.floor(l/25)>Math.floor((l-bought)/25))toast(`${ALLIES[i][1]} : dégâts doublés !`);if(l===bought)log(`${ALLIES[i][1]} rejoint votre groupe.`,"g")}else toast("Pas assez d'écus");renderPanel();break}
    case"buy":{const u=UPGS.find(x=>x[0]===b.dataset.u);if(!u||up(u[0])||S.ecus<u[3])break;S.ecus-=u[3];S.up[u[0]]=true;sfx("coin");log(`Amélioration achetée : ${u[1]}.`,"g");toast(`${u[1]} : ${u[2]}`);renderPanel();break}
    case"zone":if(S.mode!=="zone")endMode(false,"abandon");S.zone=+b.dataset.i;S.mon=null;S.spawnT=.2;S.dots=[];drawZones();drawMonster();dirty=true;break;
    case"cast":cast(CLASSES[S.cls].spells.find(s=>s.id===b.dataset.sp),false);break;
    case"ptab":ptab=b.dataset.t;renderPanel();break;
    case"tabLocked":toast(`Onglet verrouillé : il se débloque au niveau ${TAB_LOCK[b.dataset.t]}`,1);break;
    case"tab":if(!tabOpen(b.dataset.t))break;S.tab=b.dataset.t;confirmReset=false;dirty=true;renderPanel();break;
    case"alloc":{const k=b.dataset.k;let n=Math.min(S.pts,+b.dataset.n);if(SEC[k]?.cap&&!PRIM_OK[k]){const room=SEC[k].cap*SEC_STEP-(stats()[k]||0);n=Math.min(n,room);if(n<=0){toast("Bonus secondaire déjà au maximum");break}}S.alloc[b.dataset.k]+=n;S.pts-=n;dirty=true;renderPanel();break}
    case"respec":ALLOC.forEach(k=>{S.pts+=S.alloc[k];S.alloc[k]=0});S.hp=Math.min(S.hp,stats().maxHp);renderPanel();break;
    case"sell":{const k=b.dataset.r,n=b.dataset.n==="all"?S.res[k]:Math.min(+b.dataset.n,S.res[k]);if(n>0){const g=sellRes(k,n);if(n>1)toast(`${fmt(n)}× ${RES[k].name} vendus : +${fmt(g)} écus`)}renderPanel();break}
    case"mtab":mtab=b.dataset.p;renderPanel();break;
    case"atZone":atZone=+b.dataset.i;atSel=null;atOpen=null;renderPanel();break;
    case"atOpen":atOpen=atOpen===b.dataset.k?null:b.dataset.k;renderPanel();if(atOpen){const el=document.querySelector(".pset.open");if(el)el.scrollIntoView({block:"nearest"})}break;
    case"atClose":atSel=null;renderPanel(true);break;
    case"noop":break;
    case"atSel":atSel=atSel===b.dataset.i?null:b.dataset.i;renderPanel();break;
    case"craft":{const it=ITEMS[b.dataset.i];if(!canCraft(it))break;if(atSel){atSel=null;renderPanel(true)}it.recipe.forEach(([r,q])=>S.res[r]-=q);startForge(it);break}
    case"equip":equipItem(+b.dataset.u,selSlot);renderPanel();break;
    case"selSlot":{const now=performance.now(),dbl=lastSel.v==="s:"+b.dataset.s&&now-lastSel.t<450;lastSel={v:"s:"+b.dataset.s,t:now};selSlot=b.dataset.s;selLast="slot";if(dbl&&S.equip[selSlot]){delete S.equip[selSlot];S.hp=Math.min(S.hp,stats().maxHp);toast("Objet retiré",1);lastSel={v:null,t:0}}renderPanel();break}
    case"selInv":{const v=b.dataset.v,now=performance.now(),dbl=lastSel.v===v&&now-lastSel.t<450;lastSel={v,t:now};selInv=v;selLast="inv";
      if(dbl){lastSel={v:null,t:0};if(v[0]==="u"){const inst=S.items.find(i=>i.u===+v.slice(2));if(inst){const it=ITEMS[inst.id];if(S.lvl<it.lvl)toast(`Niveau ${it.lvl} requis`,1);else{equipItem(inst.u,null);toast(`${it.name} équipé`,1)}}}else if(RES[v.slice(2)]?.kind==="p")drink(v.slice(2),false)}
      renderPanel();break}
    case"filt":invF=b.dataset.f;invSub="all";invP=0;renderPanel();break;
    case"page":invP=Math.max(0,invP+ +b.dataset.d);renderPanel();break;
    case"unequip":delete S.equip[b.dataset.s];S.hp=Math.min(S.hp,stats().maxHp);renderPanel();break;
    case"sellStack":{const k=b.dataset.k,eq=new Set(Object.values(S.equip)),L=S.items.filter(x=>!eq.has(x.u)&&stackKey(x)===k);if(!L.length)break;const it=ITEMS[L[0].id],v=Math.round(it.price*(1+.2*(L[0].e||0))*sellMult()*rarOf(L[0]).m)*L.length;S.items=S.items.filter(x=>!L.includes(x));gainEcus(v);sfx("coin");selInv=null;toast(`${L.length}× ${it.name} vendus : +${fmt(v)} écus`);renderPanel();break}
    case"sellItem":{const u=+b.dataset.u,i=S.items.find(x=>x.u===u),it=ITEMS[i.id],v=Math.round(it.price*(1+.2*(i.e||0))*sellMult()*rarOf(i).m);S.items=S.items.filter(x=>x.u!==u);gainEcus(v);nextInStack(stackKey(i));toast(`${it.name} vendu : +${fmt(v)} écus`);renderPanel();break}
    case"ench":{const u=+b.dataset.u,i=S.items.find(x=>x.u===u),it=ITEMS[i.id],e=i.e||0,cost=Math.round(25*(it.z+1)*Math.pow(e+1,2));if(S.ecus<cost||e>=10)break;S.ecus-=cost;
      if(Math.random()<Math.max(.2,.9-.07*e)){i.e=e+1;inc("enchOk");mx("enchMax",i.e);toast(`Réussite ! ${it.name} +${i.e}`);log(`Enchantement réussi : ${it.name} +${i.e}.`,"g")}else{toast("L'enchantement a échoué. Les écus sont perdus.");inc("enchKo")}renderPanel();break}
    case"job":{const r=b.dataset.r;S.job=S.job&&S.job.r===r?null:{r,t:0};renderPanel();break}
    case"copy":{const t=$("exportBox");const done=()=>toast("Code copié");try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast("Sélectionné : copiez avec Ctrl+C")})}catch(err){t.select();toast("Sélectionné : copiez avec Ctrl+C")}break}
    case"import":{try{const d=JSON.parse(decodeURIComponent(escape(atob($("importBox").value.trim()))));if(!d||!d.cls)throw 0;S=Object.assign(fresh(),d);save();boot2();toast("Partie chargée")}catch(err){toast("Ce code de sauvegarde n'est pas valide. Vérifiez qu'il est complet.")}break}
    case"reset":confirmReset=true;renderPanel();break;
    case"resetNo":confirmReset=false;renderPanel();break;
    case"resetYes":confirmReset=false;S=fresh();try{localStorage.removeItem(SAVE_KEY)}catch(err){}showCreate();break;
  }
});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.opt;if(k&&e.target.type==="range"){const v=+e.target.value;S.opt[k]=Number.isFinite(v)?v:OPT_DEF[k];const o=$("ov_"+k);if(o)o.textContent=optFmt(k,S.opt[k]);applyOpts()}});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.opt;if(k&&e.target.type==="checkbox"){S.opt[k]=e.target.checked;applyOpts();if(k==="music"){audioInit();musicSync()}}});
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k==="escape"&&atSel&&!forge){atSel=null;renderPanel(true);return}
  if(tutoI>=0){if(k==="escape"){tutoEnd()}else if(k==="arrowright"||k==="enter"){e.preventDefault();tutoI++;tutoDraw()}else if(k==="arrowleft"){tutoI=Math.max(0,tutoI-1);tutoDraw()}if(k!=="tab")e.preventDefault();return}
  if((k==="enter"||k===" ")&&e.target.dataset&&e.target.dataset.a==="atOpen"){e.preventDefault();e.target.click();return}
  if(forge&&!forge.done&&(k===" "||k==="enter")){e.preventDefault();if(!e.repeat)forgeStrike();return}
  if(!S||!S.cls||!S.opt.keys||e.ctrlKey||e.metaKey||e.altKey||forge)return;if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(k==="p"){setPause(!paused);e.preventDefault();return}if(paused)return;
  if(k===" "||k==="a"){e.preventDefault();doClick(false);return}
  if(["1","2","3"].includes(k)){const sp=CLASSES[S.cls].spells[+k-1];if(sp)cast(sp,false);return}
  if(k==="b"){if(tabOpen("aventure"))startMode("boss");return}if(k==="e"){if(S.pk)takePk();return}
  if(k==="s"){const p=["p_gsoin","p_soin"].find(id=>S.res[id]>0);if(p)drink(p,false);return}
  if(k==="escape"&&S.mode!=="zone"){endMode(false,"abandon");return}
  const tk={c:"perso",i:"inv",v:"aventure",f:"atelier",o:"opts"}[k];if(tk&&tabOpen(tk)){S.tab=tk;renderPanel()}});
function setPause(v){paused=v;$("pauseBtn").textContent=v?"Reprendre":"Pause";$("pauseBtn").classList.toggle("pri",v);$("pauseOv").hidden=!v;if(v)save()}
document.addEventListener("change",e=>{if(e.target.id==="autoPot"){S.autoPot=e.target.checked;potSig="";return}if(e.target.id==="invSub"){invSub=e.target.value;invP=0;renderPanel();return}const b=e.target.closest('[data-a="auto"]');if(b){S.auto[b.dataset.s]=b.checked}});
$("monBtn").addEventListener("pointerdown",e=>{if(!S.cls||!S.mon||S.ko>0)return;e.preventDefault();FX.pt(e);doClick(false)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
window.addEventListener("pagehide",save);

/* ================= Démarrage ================= */
let lastT=performance.now(),lastPanel=0,lastAch=0,lastSave=Date.now(),paused=false,started=false;

/* Grand écran : objectifs, potions et journal passent dans une 3e colonne */
const WIDE=matchMedia("(min-width:1500px) and (min-height:650px)");
function placeSide(){const side=$("sideCard"),cb=$("combat"),w=WIDE.matches;side.hidden=!w;
  const els=["pots","goals","log"].map(id=>$(id));if(w)els.forEach(e=>side.appendChild(e));else els.forEach(e=>cb.appendChild(e))}
WIDE.addEventListener?WIDE.addEventListener("change",placeSide):WIDE.addListener(placeSide);
placeSide();
function boot2(){placeSide();fuseTrophies();if(!S.optV2){S.optV2=1;S.opt.forgeQte=true}mbSig="";potSig="";drawWeather();drawPk();drawHero();drawZones();if(!S.mon)spawn();else drawMonster();drawSpells();renderLog();dirty=true;renderPanel();live()}
function loop(){
  const now=performance.now();let dt=(now-lastT)/1000;lastT=now;
  if(S&&S.cls){
    if(paused||(S.opt.pauseHidden&&document.hidden))dt=0;
    if(dt>120){if(S.opt.offline){const s=offline(dt);boot2();if(s&&(s.kills||Object.keys(s.res).length))showOffline(s)}}
    else if(dt>0){fx=!document.hidden&&dt<1;const steps=Math.min(600,Math.ceil(dt/.2));for(let i=0;i<steps;i++)tick(dt/steps);fx=true}
    live();if(now-lastAch>1000){lastAch=now;checkAch();ensureQuests();checkTips()}
    if(dirty&&now-lastPanel>600){lastPanel=now;renderPanel()}
  }
}
function start(data){
  if(started)return;started=true;
  S=(data&&data.S)||load()||fresh();
  if(S.cls&&OLD_CLS[S.cls]){S.cls=OLD_CLS[S.cls];let r=0;for(const k in S.alloc)r+=S.alloc[k]||0;S.pts+=r;S.alloc=fresh().alloc;S.cds={};S.auto={};S.buffs=[];S.dots=[];
    setTimeout(()=>{log("Nouveau système d'éléments : votre classe a été convertie et vos points vous ont été rendus.","g");toast("Vos points de caractéristiques vous ont été rendus")},300)}
  ALLOC.forEach(k=>{if(S.alloc[k]==null)S.alloc[k]=0});
  Object.keys(PROFS).forEach(pid=>{if(!S.jobs[pid])S.jobs[pid]={lvl:1,xp:0}});
  if(!S.seen){S.seen={};Object.keys(S.res||{}).forEach(k=>{if(S.res[k]>0)S.seen[k]=1});(S.items||[]).forEach(i=>S.seen[i.id]=1)}
  S.opt=fixOpts(S.opt);applyOpts();checkUnlocks(true);
  if(!S.cls){showCreate();}
  else{const away=(Date.now()-(S.last||Date.now()))/1000;let sum=null;if(away>60&&S.opt.offline)sum=offline(away);boot2();if(sum&&(sum.kills||Object.keys(sum.res).length))showOffline(sum)}
  lastT=performance.now();setInterval(loop,100);setInterval(()=>{if(Date.now()-lastSave>=(S.opt?.saveEvery||10)*1000){lastSave=Date.now();save()}},1000);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
